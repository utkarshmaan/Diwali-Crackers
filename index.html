      --bg: #150c1f;
      --bg-glow: radial-gradient(circle at 50% -10%, #3a1f3d 0%, #150c1f 55%);
      --surface: #211530;
      --text: #f5ead9;
      --muted: #b9a8bb;
      --line: #3c2a45;
      --gold: #f0b23e;
      --gold-bright: #ffcf6b;
      --ember: #ff7256;
      --ember-bright: #ff8f6f;
      --btn-text: #1b0f10;
    }
  }
  :root[data-theme="dark"] {
    --bg: #150c1f;
    --bg-glow: radial-gradient(circle at 50% -10%, #3a1f3d 0%, #150c1f 55%);
    --surface: #211530;
    --text: #f5ead9;
    --muted: #b9a8bb;
    --line: #3c2a45;
    --gold: #f0b23e;
    --gold-bright: #ffcf6b;
    --ember: #ff7256;
    --ember-bright: #ff8f6f;
    --btn-text: #1b0f10;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-glow), var(--bg);
    color: var(--text);
    font-family: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.5;
    padding-bottom: 96px;
  }
  h1, h2, .brandname { font-family: 'Bricolage Grotesque', -apple-system, sans-serif; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 20px; }

  header { text-align: left; margin-bottom: 22px; }
  .flame {
    width: 26px; height: 26px; flex: 0 0 26px;
    animation: flicker 3.2s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.06) rotate(-2deg); opacity: 0.9; }
  }
  .brandname {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .tagline {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
    max-width: 46ch;
  }

  .category {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 30px;
  }
  .category h2 {
    position: sticky;
    top: 0;
    z-index: 2;
    grid-column: 1 / -1;
    font-size: 21px;
    font-weight: 600;
    color: var(--gold);
    margin: 0;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    text-align: center;
  }
  .category h2.is-stuck { background: var(--bg); }

  .item-row {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
  }

  .item-icon {
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: linear-gradient(150deg, var(--surface), var(--line));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item-icon svg { width: 56px; height: 56px; }
  .item-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .item-main { display: flex; flex-direction: column; min-width: 0; }
  .item-info { min-width: 0; padding: 12px 12px 10px; }
  .item-name { font-weight: 600; font-size: 15.5px; }
  .item-meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .item-price { color: var(--gold); font-weight: 600; }

  .stepper {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
    width: calc(100% - 104px);
    margin: 0 auto 12px auto;
    background: var(--surface);
  }
  .stepper button {
    width: 58px; height: 28px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .stepper button:first-child{
    border-right: 1px solid var(--line);
  }
   .stepper button:last-child{
    border-left: 1px solid var(--line);
   }
  .stepper button:active { background: var(--line); }
  .stepper input {
    width: 28px;
    flex: 1;
    border: none;
    background: transparent;
    text-align: center;
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { outline: none; }

  .details {
    margin-top: 34px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .details h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    margin: 0 0 12px;
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13.5px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--gold-bright); outline-offset: 1px; }
  .cod-option {
    display: flex !important;
    align-items: center;
    gap: 9px;
    margin-bottom: 0 !important;
    color: var(--text) !important;
    cursor: pointer;
  }
  .cod-option input {
    width: 18px;
    height: 18px;
    margin: 0;
    padding: 0;
    flex-shrink: 0;
    accent-color: var(--ember);
  }
  .field textarea { resize: vertical; }

  .note {
    margin-top: 26px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .cartbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 12px 18px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .cartbar-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .cart-total { font-size: 13.5px; color: var(--muted); }
  .cart-total strong { color: var(--text); font-size: 16px; display: block; }
  .send-btn {
    background: linear-gradient(135deg, var(--ember-bright), var(--ember));
    color: var(--btn-text);
    border: none;
    padding: 13px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .send-btn:disabled {
    background: var(--line);
    color: var(--muted);
    cursor: not-allowed;
  }
  .send-btn:not(:disabled):active { transform: translateY(1px); }

  .fallback-link {
    display: block;
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
  }
</style>

      { id: "sk-brand-angry-birds-3-piece-bigshell-skyshot-pack", name: "Sk Brand Angry Birds 3 Piece Bigshell Skyshot Pack", meta: "", price: "", image: "./images/sk-brand-angry-birds-3-piece-bigshell-skyshot-pack.jpg", brand: "others" },
      { id: "sonny-crackling-flower-skyshot-5-piece", name: "Sonny Crackling Flower Skyshot 5 Piece", meta: "", price: "", image: "./images/sonny-crackling-flower-skyshot-5-piece.jpg", brand: "others" },
      { id: "sonny-glitter-flitter-skyshot-big-shell", name: "Sonny Glitter Flitter Skyshot Big Shell", meta: "", price: "", image: "./images/sonny-glitter-flitter-skyshot-big-shell.jpg", brand: "others" },
      { id: "sri-krishnasamys-balle-balle-30-shots", name: "Sri Krishnasamys Balle Balle 30 Shots", meta: "", price: "", image: "./images/sri-krishnasamys-balle-balle-30-shots.jpg", brand: "others" },
      { id: "vinayaga-sonny-brand-panorama-skyshot-big-shell", name: "Vinayaga Sonny Brand Panorama Skyshot Big Shell", meta: "", price: "", image: "./images/vinayaga-sonny-brand-panorama-skyshot-big-shell.jpg", brand: "others" },
    { id: "sunshine-brand-raid-and-flyiers", name: "Sunshine Brand Raid And Flyiers", meta: "", price: "", image: "./images/sunshine-brand-raid-and-flyiers.jpg", brand: "others" },
      { id: "vinayaga-sonny-brand-cappuccino-and-sonny-fireworks", name: "Vinayaga Sonny Brand Cappuccino And Sonny Fireworks", meta: "", price: "", image: "./images/vinayaga-sonny-brand-cappuccino-and-sonny-fireworks.jpg", brand: "others" },
      { id: "vinayaga-sonny-magic-crystal", name: "Vinayaga Sonny Magic Crystal", meta: "", price: "", image: "./images/vinayaga-sonny-magic-crystal.jpg", brand: "others" },
    { id: "bharat-fancy-3-in-1-blackberry", name: "Bharat Fancy 3 In 1 Blackberry", meta: "", price: "", image: "./images/bharat-fancy-3-in-1-blackberry.jpg", brand: "others" },
      { id: "blue-eyes", name: "Blue Eyes", meta: "", price: "", image: "./images/blue-eyes.jpg", brand: "others" },
       { id: "mercury-siren", name: "Mercury Siren", meta: "", price: "", image: "./images/mercury-siren.jpg", brand: "others" },
      { id: "mercury-vibrant-blast", name: "Mercury Vibrant Blast", meta: "", price: "", image: "./images/mercury-vibrant-blast.jpg", brand: "others" },
     
    ]},
  ];

  // One simple icon per category — swap these for real product photos later if you send them
  const CATEGORY_ICONS = {
    "Phuljhadi(फुलझड़ी)": `<svg viewBox="0 0 24 24" fill="none"><line x1="12" y1="22" x2="12" y2="14" stroke="var(--gold-bright)" stroke-width="2" stroke-linecap="round"/><g stroke="var(--ember-bright)" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="10" x2="12" y2="4"/><line x1="8.5" y1="11.5" x2="4.5" y2="7.5"/><line x1="15.5" y1="11.5" x2="19.5" y2="7.5"/><line x1="7" y1="8" x2="3.5" y2="9.5"/><line x1="17" y1="8" x2="20.5" y2="9.5"/></g><circle cx="12" cy="10" r="2" fill="var(--gold-bright)"/></svg>`,
    "Chakri(चकरी)": `<svg viewBox="0 0 24 24" fill="none"><path d="M12 12 L12 3 A9 9 0 0 1 21 12 Z" fill="var(--ember-bright)" opacity="0.9"/><path d="M12 12 L12 3 A9 9 0 0 1 21 12 Z" fill="var(--gold-bright)" opacity="0.9" transform="rotate(180 12 12)"/><circle cx="12" cy="12" r="2.4" fill="var(--surface)"/></svg>`,
    "Patakhe(पटाखे)": `<svg viewBox="0 0 24 24" fill="none"><rect x="9" y="8" width="6" height="13" rx="2" fill="var(--ember-bright)"/><rect x="9" y="8" width="6" height="3" fill="var(--gold-bright)"/><path d="M12 8 C12 8 12 5 12 4" stroke="var(--gold-bright)" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="3" r="1.6" fill="var(--gold-bright)"/></svg>`,
    "Rocket aur Sky Shots(रॉकेट और स्काई शॉट)": `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3 C15 6 16 11 15 15 L9 15 C8 11 9 6 12 3Z" fill="var(--ember-bright)"/><path d="M9 15 L6 19 L9.5 18Z" fill="var(--gold-bright)"/><path d="M15 15 L18 19 L14.5 18Z" fill="var(--gold-bright)"/><circle cx="12" cy="9" r="1.6" fill="var(--surface)"/><path d="M10 15 L9 21 M14 15 L15 21" stroke="var(--gold-bright)" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    "Combo": `<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="1.5" fill="var(--ember-bright)"/><rect x="4" y="7" width="16" height="4" rx="1" fill="var(--gold-bright)"/><rect x="11" y="7" width="2" height="13" fill="var(--surface)"/><path d="M9 7 C7 7 6.5 4 9 4 C11 4 11 7 11 7Z" fill="var(--gold-bright)"/><path d="M15 7 C17 7 17.5 4 15 4 C13 4 13 7 13 7Z" fill="var(--gold-bright)"/></svg>`,
  };

  const qty = {};
  const catalogEl = document.getElementById('catalog');

  CATALOG.forEach(group => {
    const section = document.createElement('div');
    section.className = 'category';
    const h2 = document.createElement('h2');
    h2.textContent = group.category;
    section.appendChild(h2);

    const iconSvg = CATEGORY_ICONS[group.category] || '';

    group.items.forEach(item => {
      qty[item.id] = 0;
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="item-main">
          <div class="item-icon">${item.image ? `<img src="${item.image}" alt="${item.name}">` : iconSvg}</div>
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            ${item.meta || item.price !== "" ? `<div class="item-meta">${[item.meta, item.price !== "" ? `<span class="item-price">₹${item.price}</span>` : ""].filter(Boolean).join(" · ")}</div>` : ""}
          </div>
        </div>
        <div class="stepper">
          <button type="button" aria-label="Decrease" data-action="dec" data-id="${item.id}">−</button>
          <input type="text" inputmode="numeric" readonly value="0" id="qty-${item.id}">
          <button type="button" aria-label="Increase" data-action="inc" data-id="${item.id}">+</button>
        </div>
      `;
      section.appendChild(row);
    });
    catalogEl.appendChild(section);
  });

  function updateStickyCategoryBackground() {
    catalogEl.querySelectorAll('.category h2').forEach(heading => {
      heading.classList.toggle('is-stuck', heading.getBoundingClientRect().top <= 0);
    });
  }

  window.addEventListener('scroll', updateStickyCategoryBackground, { passive: true });
  updateStickyCategoryBackground();

  function itemById(id) {
    for (const g of CATALOG) {
      const found = g.items.find(i => i.id === id);
      if (found) return found;
    }
    return null;
  }

  function updateSummary() {
    let count = 0, total = 0, hasUnpricedItems = false;
    Object.keys(qty).forEach(id => {
      const q = qty[id];
      if (q > 0) {
        count += q;
        const item = itemById(id);
        if (item.price === "") hasUnpricedItems = true;
        else total += q * item.price;
      }
    });
    document.getElementById('itemCountLabel').textContent = count === 1 ? '1 item' : `${count} items`;
    document.getElementById('cartTotal').textContent = hasUnpricedItems ? 'Price to be confirmed' : `₹${total}`;
    document.getElementById('sendBtn').disabled = count === 0;
  }

  catalogEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const delta = btn.dataset.action === 'inc' ? 1 : -1;
    qty[id] = Math.max(0, qty[id] + delta);
    document.getElementById(`qty-${id}`).value = qty[id];
    updateSummary();
  });

  const codCheckbox = document.getElementById('codEnabled');
  const codAddressField = document.getElementById('codAddressField');
  const codAddress = document.getElementById('custAddress');
  const nameInput = document.getElementById('custName');
  const phoneInput = document.getElementById('custPhone');

  [nameInput, phoneInput].forEach(input => {
    input.addEventListener('input', () => input.setCustomValidity(''));
  });

  codCheckbox.addEventListener('change', () => {
    const codEnabled = codCheckbox.checked;
    codAddressField.hidden = !codEnabled;
    codAddress.required = codEnabled;
    codCheckbox.setAttribute('aria-expanded', String(codEnabled));
  });

  document.getElementById('sendBtn').addEventListener('click', () => {
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const address = codAddress.value.trim();
    const codEnabled = codCheckbox.checked;

    if (!name) {
      nameInput.setCustomValidity('Please enter your name.');
      nameInput.reportValidity();
      return;
    }

    if (!phone) {
      phoneInput.setCustomValidity('Please enter your phone number.');
      phoneInput.reportValidity();
      return;
    }

    if (codEnabled && !address) {
      codAddress.reportValidity();
      return;
    }

    let lines = ["New Diwali cracker order:", ""];
    const brandLines = { cock: [], others: [] };
    let total = 0, hasUnpricedItems = false;
    CATALOG.forEach(group => {
      group.items.forEach(item => {
        const q = qty[item.id];
        if (q > 0) {
          if (item.price === "") {
            hasUnpricedItems = true;
            brandLines[item.brand].push(`- ${item.name} x${q}`);
            return;
          }
          const lineTotal = q * item.price;
          total += lineTotal;
          brandLines[item.brand].push(`- ${item.name} x${q} = ₹${lineTotal}`);
        }
      });
    });
    ["cock", "others"].forEach(brand => {
      if (brandLines[brand].length > 0) {
        const brandLabel = brand === "cock" ? "Cock" : "Others";
        lines.push(`${brandLabel} :`, ...brandLines[brand], "");
      }
    });
    lines.push("");
    lines.push(hasUnpricedItems ? 'Total: Price to be confirmed' : `Total: ₹${total}`);
    if (name) lines.push(`Name: ${name}`);
    if (phone) lines.push(`Phone: ${phone}`);
    if (codEnabled) {
      lines.push('Payment: Cash On Delivery (COD)');
      lines.push(`Delivery address: ${address}`);
    }

    const message = encodeURIComponent(lines.join("\n"));
    // Native app scheme — opens the WhatsApp mobile app directly, skipping the
    // "Open app / Continue to WhatsApp Web" chooser that wa.me links can show.
    window.location.href = `whatsapp://send?phone=${WHATSAPP_NUMBER}&text=${message}`;
  });

  updateSummary();
</script>
